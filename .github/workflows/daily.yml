name: Daily injury dashboard

on:
  schedule:
    - cron: "10 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install nflreadpy pandas pyarrow requests

      - name: Build beneficiary map
        run: |
          if [ ! -f cache/beneficiaries.csv ] || [ "$(date +%u)" = "2" ]; then
            python injury_watch.py build-map
          fi

      - name: Build dashboard
        run: python dashboard.py

      - name: Commit and publish
        run: |
          cp dashboard.html index.html
          git config user.name "injury-watch"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "dashboard $(date -u +%Y-%m-%d)"
          git push
